name: Wikimedia CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_lint:
    name: Code Quality, Tests & Bundle Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          pip install flake8 pytest pyspark pyyaml chispa

      - name: Lint Code with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 \
            --builtins=spark,dbutils,display,GOLD,SILVER,BRONZE,DATA_ENGINEERS_GROUP,ADMINS_GROUP,ROW_ADMIN_GROUP \
            --show-source --statistics

      - name: Run PySpark Tests
        run: |
          pytest tests/ -v

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 0.279.0

      - name: Validate Databricks Bundle (CI)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          DATABRICKS_AUTH_TYPE: azure-client-secret
        run: |
          echo "Validate the bundle configuration CI..."
          databricks auth describe
          databricks bundle validate -t azure_trial_2

  deploy:
    name: Databricks CD Deploy
    needs: test_and_lint

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: azure_trial_2
    concurrency:
      group: wikimedia-bundle-azure_trial_2
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 0.279.0

      - name: Deploy Bundle to Workspace (CD)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          DATABRICKS_AUTH_TYPE: azure-client-secret
        run: |
          echo "Deploying the code to Databricks..."
          databricks bundle deploy -t azure_trial_2
