name: Wikimedia CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_lint:
    name: Code Quality & PySpark Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install flake8

      - name: Lint Code with Flake8
        run: |
          flake8 . --count --show-source --statistics

      - name: Run PySpark Tests
        run: |
          pytest tests/ -v
  deploy:
    name: Databricks Azure Trial Deploy
    needs: test_and_lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure_trial_2
    concurrency:
      group: wikimedia-bundle-azure_trial_2
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      DATABRICKS_AUTH_TYPE: azure-client-secret
      DATABRICKS_CONFIG_FILE: ${{ runner.temp }}/wikimedia.databrickscfg
      DATABRICKS_BUNDLE_VAR_warehouse_id: ${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 0.279.0

      - name: Configure Azure target profile
        run: |
          python - <<'PY'
          import configparser
          import os
          config = configparser.ConfigParser()
          config['azure_trial_2'] = {'host': os.environ['DATABRICKS_HOST']}
          with open(os.environ['DATABRICKS_CONFIG_FILE'], 'w') as file:
              config.write(file)
          PY

      - name: Validate Azure bundle
        run: |
          databricks auth describe
          databricks bundle validate -t azure_trial_2 --strict

      - name: Deploy Azure bundle
        run: databricks bundle deploy -t azure_trial_2
