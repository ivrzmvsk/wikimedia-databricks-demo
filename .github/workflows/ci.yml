name: Wikimedia CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_and_lint:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          pip install -r tests/requirements-test.txt flake8

      - name: Configure PySpark Python
        run: |
          echo "PYSPARK_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYSPARK_DRIVER_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Lint Code with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 \
            --builtins=spark,dbutils,display,GOLD,SILVER,BRONZE,DATA_ENGINEERS_GROUP,ADMINS_GROUP,ROW_ADMIN_GROUP \
            --show-source --statistics

      - name: Run PySpark Tests
        run: |
          pytest tests/ -v

  deploy:
    name: Databricks Bundle Validation & Deploy
    needs: test_and_lint

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: azure_trial_2
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat
      BUNDLE_VAR_warehouse_id: ${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID }}
    concurrency:
      group: wikimedia-bundle-azure_trial_2
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.5
          terraform_wrapper: false

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks Profile
        run: |
          : "${DATABRICKS_HOST:?Set the DATABRICKS_HOST Actions secret}"
          : "${DATABRICKS_TOKEN:?Set the DATABRICKS_TOKEN Actions secret}"
          : "${BUNDLE_VAR_warehouse_id:?Set the DATABRICKS_SQL_WAREHOUSE_ID Actions secret}"
          printf '[azure_trial_2]\nhost = %s\nauth_type = pat\n' "$DATABRICKS_HOST" > ~/.databrickscfg

      - name: Check Databricks Authentication
        run: databricks current-user me -p azure_trial_2 -o json

      - name: Validate Databricks Bundle
        run: databricks bundle validate -t azure_trial_2

      - name: Deploy Bundle to Workspace (CD)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DATABRICKS_TERRAFORM_EXEC_PATH: /usr/local/bin/terraform
        run: |
          databricks bundle deploy -t azure_trial_2
