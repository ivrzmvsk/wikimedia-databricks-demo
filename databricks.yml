bundle:
  name: wikimedia-databricks-demo
  databricks_cli_version: '>= 0.279.0'

include:
  - resources/*.yml

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  paths:
    - src
    - pipelines
    - notebooks

variables:
  zerobus_service_principal:
    description: Optional OAuth application ID granted access to the Zerobus inbox during setup.
    default: ''
  catalog:
    description: Existing Unity Catalog catalog.
    default: workspace
  bronze_schema:
    default: wikimediademo_bronze
  silver_schema:
    default: wikimediademo_silver
  gold_schema:
    default: wikimediademo_gold
  warehouse_id:
    description: Existing SQL warehouse ID for the quality alerts.
  schedule_pause_status:
    description: Schedule state for targets that allow scheduling; development targets remain paused.
    default: PAUSED
  data_engineers_group:
    default: data_engineers
  admins_group:
    default: admins
  row_admin_group:
    default: admin_group

targets:
  ivan_personal:
    default: true
    mode: development
    workspace:
      profile: personal-env

  azure_trial_2:
    workspace:
      profile: azure_trial_2
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
    presets:
      trigger_pause_status: PAUSED
